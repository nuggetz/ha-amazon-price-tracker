<svg width="680" height="680" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Amazon Price Tracker logo</title>
<desc>Logo per amazon_price_tracker: sfondo scuro, grafico prezzi con freccia verde al minimo, smile Amazon stilizzato</desc>

<style>
  .bg { fill: #1a1a2e; }
  .ring-outer { fill: #FF9900; }
  .ring-inner { fill: #1a1a2e; }
  .grid { stroke: #2a2a4a; stroke-width: 1.5; }
  .chart-main { fill: none; stroke: #FF9900; stroke-width: 6; }
  .chart-drop { fill: none; stroke: #00c853; stroke-width: 7; }
  .area-fill { fill: url(#areaGrad); }
  .dot-main { fill: #FF9900; }
  .dot-low { fill: #00c853; stroke: #ffffff; stroke-width: 3; }
  .arrow-body { fill: #00c853; }
  .arrow-glow { fill: #00c853; opacity: 0.15; }
  .smile { fill: none; stroke: #FF9900; stroke-width: 9; stroke-linecap: round; }
  .smile-tip { fill: #FF9900; }
  .euro { font-family: monospace; font-size: 48px; font-weight: bold; fill: #ffffff; opacity: 0.08; }
</style>

<defs>
  <clipPath id="circleClip">
    <circle cx="340" cy="330" r="248"/>
  </clipPath>
  <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF9900" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#FF9900" stop-opacity="0.0"/>
  </linearGradient>
</defs>

<!-- outer ring -->
<circle cx="340" cy="330" r="268" class="ring-outer"/>
<circle cx="340" cy="330" r="252" class="ring-inner"/>

<g clip-path="url(#circleClip)">
  <circle cx="340" cy="330" r="252" class="bg"/>
  <text x="310" y="420" class="euro" text-anchor="middle">€</text>

  <line x1="110" y1="230" x2="570" y2="230" class="grid"/>
  <line x1="110" y1="300" x2="570" y2="300" class="grid"/>
  <line x1="110" y1="370" x2="570" y2="370" class="grid"/>
  <line x1="110" y1="440" x2="570" y2="440" class="grid" stroke-dasharray="4,6"/>

  <polygon
    points="130,440 130,390 185,340 235,355 285,295 330,310 375,255 415,270 460,218 510,235 510,440"
    class="area-fill"/>

  <polyline
    points="130,390 185,340 235,355 285,295 330,310 375,255 415,270 460,218 510,235"
    class="chart-main"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <polyline
    points="415,270 460,218 510,235"
    class="chart-drop"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <circle cx="130" cy="390" r="6" class="dot-main"/>
  <circle cx="185" cy="340" r="6" class="dot-main"/>
  <circle cx="235" cy="355" r="6" class="dot-main"/>
  <circle cx="285" cy="295" r="6" class="dot-main"/>
  <circle cx="330" cy="310" r="6" class="dot-main"/>
  <circle cx="375" cy="255" r="6" class="dot-main"/>
  <circle cx="415" cy="270" r="6" class="dot-main"/>
  <circle cx="460" cy="218" r="6" class="dot-main"/>
  <circle cx="510" cy="235" r="12" class="dot-low"/>

  <rect x="518" y="206" width="46" height="22" rx="5" fill="#0d3320"/>
  <text x="541" y="221" font-family="monospace" font-size="11" fill="#00c853" font-weight="bold" text-anchor="middle">MIN</text>

  <g transform="translate(340, 490)">
    <circle cx="0" cy="-4" r="36" class="arrow-glow"/>
    <rect x="-9" y="-38" width="18" height="36" rx="4" class="arrow-body"/>
    <polygon points="-26,4 26,4 0,38" class="arrow-body"/>
  </g>

  <path d="M 210,590 Q 340,640 470,590" class="smile"/>
  <polygon points="460,582 476,592 462,604" class="smile-tip"/>
</g>

<text x="340" y="630" font-family="monospace" font-size="18" fill="#FF9900" letter-spacing="1" text-anchor="middle">price tracker</text>

</svg>
